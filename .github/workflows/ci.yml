name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        node: ["20.18.3", "22"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run hardhat:compile
      - run: npm test
      - run: npm run lint
      - run: npm run check-types
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run build
      - run: cp .env.example packages/nextjs/.env
      - run: npm run db:push -w @fixpoint/nextjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fixpoint
      - run: npm run db:seed -w @fixpoint/nextjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fixpoint
      - run: npm run start -w @fixpoint/nextjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fixpoint
          PORT: "3000"
      - run: sleep 8
      - run: curl -fsS http://localhost:3000/ > /dev/null
      - run: curl -fsS http://localhost:3000/invoices/new > /dev/null
      - run: curl -fsS http://localhost:3000/history > /dev/null
      - run: curl -fsS http://localhost:3000/api/price > /dev/null
      - run: curl -sS -o /dev/null -w "%{http_code}" http://localhost:3000/does-not-exist | grep -q 404
