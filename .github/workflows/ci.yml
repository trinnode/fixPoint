name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        node: ["20.18.3", "22"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/hardhat/package-lock.json
            packages/nextjs/package-lock.json
      - run: npm install
      - run: npm run hardhat:compile
      - run: npm test
      - run: npm run lint
      - run: npm run check-types
      - run: npm run build
